[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-agents"
version = "0.1.0"
description = "Multi-timeframe FX analysis cascade (LangGraph) with Telegram control"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "psycopg[binary,pool]>=3.2",
  "python-telegram-bot>=21.0",
  "yfinance>=0.2.40",
  "pandas>=2.0",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
forex-agents = "forex_agents.cli:main"
forex-bot = "forex_agents.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
